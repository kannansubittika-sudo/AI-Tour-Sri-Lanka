<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AI Tour Sri Lanka</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🌴 AI Tour Sri Lanka
        </a>

        <a href="/logout" class="btn btn-danger">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>
</nav>

<div class="container mt-5">

    <div class="text-center mb-5">

        <h1>Welcome, {{ username }} 👋</h1>

        <p>
            Start planning your next adventure across Sri Lanka.
        </p>

    </div>

    <div class="row g-4">

        <!-- Plan New Trip -->
        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <i class="bi bi-map fs-1 text-primary"></i>

                    <h4 class="mt-3">Plan New Trip</h4>

                    <a href="/planner" class="btn btn-primary mt-3">
                        Open Planner
                    </a>

                </div>

            </div>

        </div>

        <!-- AI Recommendation -->
        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <i class="bi bi-stars fs-1 text-success"></i>

                    <h4 class="mt-3">
                        AI Recommendation
                    </h4>

                    <a href="/recommend" class="btn btn-success mt-3">
                        View
                    </a>

                </div>

            </div>

        </div>

        <!-- My Profile -->
        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <i class="bi bi-person-circle fs-1 text-warning"></i>

                    <h4 class="mt-3">
                        My Profile
                    </h4>

                    <button class="btn btn-warning mt-3">
                        Coming Soon
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
